<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Carrito</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">
            <h2>Carrito de Compras</h2>
        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                    <th>Accion</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="item : ${items}">

                    <td th:text="${item.producto.nombre}"></td>

                    <td>
                        Q <span th:text="${item.producto.precio}"></span>
                    </td>

                    <td>

                        <a th:href="@{/restar/{id}(id=${item.id})}"
                           class="btn btn-warning btn-sm">
                            -
                        </a>

                        <span class="mx-2 fw-bold"
                              th:text="${item.cantidad}">
                        </span>

                        <a th:href="@{/sumar/{id}(id=${item.id})}"
                           class="btn btn-primary btn-sm">
                            +
                        </a>

                    </td>

                    <td>
                        Q <span th:text="${item.subtotal}"></span>
                    </td>

                    <td>

                        <a th:href="@{/eliminar/{id}(id=${item.id})}"
                           class="btn btn-danger btn-sm">
                            Eliminar
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

            <div class="text-end mb-4">

                <h3>
                    Total:
                    <span class="text-success fw-bold">
                        Q <span th:text="${total}"></span>
                    </span>
                </h3>

            </div>

            <div class="d-flex gap-2">

                <button class="btn btn-success"
                        onclick="confirmarCompra()">
                    Confirmar compra
                </button>

                <a href="/" class="btn btn-secondary">
                    Volver a productos
                </a>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>

    function confirmarCompra() {

        Swal.fire({
            title: '¿Confirmar compra?',
            text: 'Se realizara la compra de los productos',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Si, comprar',
            cancelButtonText: 'Cancelar'
        }).then(function(result) {

            if (result.isConfirmed) {

                window.location.href = '/comprar';

            }

        });

    }

</script>

<script th:if="${mensaje}">

    Swal.fire({
        title: 'Compra realizada',
        text: '¡Compra realizada con exito!',
        icon: 'success',
        confirmButtonText: 'Aceptar'
    });

</script>

</body>
</html>
