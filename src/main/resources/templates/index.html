<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Carrito de Compras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="fw-bold">Carrito de Compras</h1>

        <a href="/carrito" class="btn btn-dark">
            Ver carrito
        </a>

    </div>

    <div class="row">

        <div class="col-md-4 mb-4" th:each="producto : ${productos}">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h4 class="card-title fw-bold"
                        th:text="${producto.nombre}">
                    </h4>

                    <p class="text-success fw-bold fs-5">
                        Q <span th:text="${producto.precio}"></span>
                    </p>

                    <p class="text-muted">
                        Stock:
                        <span th:text="${producto.stock}"></span>
                    </p>

                    <div th:if="${producto.stock > 0}">

                        <a th:href="@{/agregar/{id}(id=${producto.id})}"
                           class="btn btn-primary w-100">
                            Agregar al carrito
                        </a>

                    </div>

                    <div th:if="${producto.stock <= 0}">

                        <button class="btn btn-secondary w-100" disabled>
                            Sin existencias
                        </button>

                        <p class="text-danger fw-bold text-center mt-2">
                            Producto agotado
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:inline="javascript">

    /*<![CDATA[*/

    let mensaje = /*[[${mensaje}]]*/ null;

    if (mensaje != null) {

        Swal.fire({
            title: 'Exito',
            text: mensaje,
            icon: 'success',
            confirmButtonText: 'Aceptar'
        });

    }

    /*]]>*/

</script>

</body>
</html>
